<title>Textes du portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
/* Same world as the site: night blue, limestone, one blue accent. Section index on the left, one long form on the right. */
:root {
	--bg: #ffffff; --panel: #f6f3ee; --fg: #14263f; --muted: #566377; --line: #e2ded6;
	--accent: #46628f; --strong: #14263f; --on-strong: #ffffff; --danger: #a33a2c;
	--serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
	--sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
	--bg: #0f1e33; --panel: #16283f; --fg: #eef1f6; --muted: #a9b5c7; --line: #2a3d57;
	--accent: #b4c3dc; --strong: #eef1f6; --on-strong: #0f1e33; --danger: #f0a095; color-scheme: dark;
} }
:root[data-theme="dark"] {
	--bg: #0f1e33; --panel: #16283f; --fg: #eef1f6; --muted: #a9b5c7; --line: #2a3d57;
	--accent: #b4c3dc; --strong: #eef1f6; --on-strong: #0f1e33; --danger: #f0a095; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.1; margin: 0; text-wrap: balance; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.top h1 { font-size: 26px; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
#saved { font-size: 13px; color: var(--muted); }
#saved.bad { color: var(--danger); }
.btn { border: 1px solid var(--strong); background: var(--strong); color: var(--on-strong); padding: 9px 14px; font-size: 13px; font-weight: 500; }
.btn.quiet { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.work { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; align-items: start; }
.index { position: sticky; top: 92px; display: flex; flex-direction: column; }
.index button { background: none; border: 0; border-left: 2px solid transparent; padding: 7px 12px; text-align: left; color: var(--muted); font-size: 14px; }
.index button:hover { color: var(--fg); }
.index button.on { color: var(--fg); border-left-color: var(--accent); font-weight: 500; }
@media (max-width: 820px) {
	.work { grid-template-columns: minmax(0, 1fr); gap: 20px; }
	.index { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px 6px; }
	.index button { border: 1px solid var(--line); padding: 5px 10px; font-size: 13px; }
	.index button.on { border-color: var(--accent); }
}

form { display: flex; flex-direction: column; gap: 44px; min-width: 0; margin: 0; }
section { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 130px; min-width: 0; }
section > h2 { font-size: 32px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .sub { font-size: 13px; font-weight: 500; color: var(--muted); }
.sub { margin: 6px 0 -6px; }
input[type=text], textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); padding: 9px 11px; border-radius: 0; }
input[type=text]:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 92px; }
.bad-in { border-color: var(--danger) !important; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint.warn { color: var(--danger); }

.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.item.block { background: var(--panel); padding: 12px; }
.item-fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tools { display: flex; gap: 4px; }
.tools button { width: 32px; height: 38px; background: none; border: 1px solid var(--line); color: var(--muted); }
.tools button:hover:not(:disabled) { color: var(--fg); border-color: var(--accent); }
.tools button:disabled { opacity: .35; cursor: default; }
.add { align-self: flex-start; background: none; border: 1px dashed var(--line); color: var(--fg); padding: 7px 12px; font-size: 13px; }
.add:hover { border-color: var(--accent); }

.state { padding-block: 40px; color: var(--muted); }
#update { background: var(--panel); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
#update h2 { border: 0; padding: 0; font-size: 26px; }
#update ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 62ch; }
code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }
#copyArea { min-height: 120px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
</style>

<header class="top">
	<div class="top-in">
		<h1>Textes du portfolio</h1>
		<div class="actions">
			<span id="saved" role="status" aria-live="polite">Connexion…</span>
			<button class="btn quiet" id="copyBtn" type="button" disabled>Copier le fichier</button>
			<button class="btn" id="saveBtn" type="button" disabled>Télécharger content.json</button>
		</div>
	</div>
</header>

<main class="work">
	<nav class="index" id="index" aria-label="Sections"></nav>
	<form id="form" autocomplete="off"><p class="state">Chargement de vos textes. Ils apparaîtront ici, section par section.</p></form>
</main>

<script>
(() => {
	'use strict';
	const $ = (s) => document.querySelector(s);
	const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

	// What can be edited. long: true gives a multi-line box.
	const F = (path, label, long) => ({ path, label, long });
	const SECTIONS = [
		{ id: 'coordonnees', title: 'Nom et coordonnées', hint: 'Laissez le téléphone vide pour le masquer. Un réseau resté sur # n’apparaît pas sur le site.', fields: [F('site.name', 'Nom'), F('site.email', 'E-mail'), F('site.phone', 'Téléphone')],
			lists: [{ path: 'site.socials', label: 'Réseaux sociaux', keys: [['label', 'Nom'], ['href', 'Lien']], blank: { label: '', href: '#' } }] },
		{ id: 'accueil', title: 'Accueil', hint: 'Le CV téléchargé se remplace dans le dossier site\\public\\cv.', fields: [F('copy.intro.label', 'Petite ligne au-dessus du nom'), F('copy.intro.role', 'Titre sous le nom'), F('copy.intro.text', 'Présentation', true), F('cv.download', 'Bouton du CV'), F('copy.intro.primaryCta', 'Premier lien'), F('copy.intro.secondaryCta', 'Second lien')] },
		{ id: 'travaux', title: 'Projets', hint: 'Les projets eux-mêmes se modifient dans l’artefact Projets du portfolio.', fields: [F('copy.work.label', 'Petite ligne'), F('copy.work.title', 'Titre'), F('copy.work.text', 'Texte d’introduction', true)] },
		{ id: 'expertises', title: 'Expertises', fields: [F('copy.services.label', 'Petite ligne'), F('copy.services.title', 'Titre')], lists: [{ path: 'services', label: 'Expertises', blank: '' }] },
		{ id: 'apropos', title: 'À propos', fields: [F('copy.about.label', 'Petite ligne'), F('copy.about.title', 'Titre'), F('copy.about.text', 'Présentation', true), F('copy.about.pathTitle', 'Titre du parcours'), F('copy.about.path', 'Parcours', true), F('copy.about.cta', 'Bouton'), F('copy.about.visionTitle', 'Titre de la vision'), F('copy.about.vision', 'Vision', true), F('copy.about.missionTitle', 'Titre de la mission'), F('copy.about.mission', 'Mission', true)],
			lists: [{ path: 'copy.about.values', label: 'Valeurs', blank: '' }] },
		{ id: 'questions', title: 'Questions fréquentes', fields: [F('copy.faq.label', 'Petite ligne'), F('copy.faq.title', 'Titre'), F('copy.faq.aside', 'Phrase d’appel'), F('copy.faq.asideLink', 'Lien vers le contact'), F('copy.faq.asideEnd', 'Fin de la phrase')],
			lists: [{ path: 'faq', label: 'Questions', keys: [['q', 'Question'], ['a', 'Réponse', true]], blank: { q: '', a: '' } }] },
		{ id: 'contact', title: 'Contact', fields: [F('copy.contact.label', 'Petite ligne'), F('copy.contact.title', 'Titre'), F('copy.contact.text', 'Texte', true), F('copy.contact.typeLabel', 'Libellé du premier choix'), F('copy.contact.extraField.label', 'Libellé du second choix'), F('copy.contact.messageLabel', 'Libellé du message'), F('copy.contact.messagePlaceholder', 'Exemple dans le champ message'), F('copy.contact.submit', 'Bouton d’envoi'), F('copy.contact.responseTime', 'Mention à côté du bouton'), F('copy.contact.mailSubject', 'Objet de l’e-mail reçu')],
			lists: [{ path: 'copy.contact.sessionTypes', label: 'Options du premier choix', blank: '' }, { path: 'copy.contact.extraField.options', label: 'Options du second choix', blank: '' }] },
		{ id: 'menu', title: 'Menu et pied de page', fields: [F('copy.header.cta', 'Bouton du menu'), F('copy.footer.description', 'Phrase du pied de page', true)],
			lists: [{ path: 'nav', label: 'Entrées du menu', keys: [['label', 'Nom']], fixed: true }] },
	];

	let db = null, ref = null, downloads = null, canWrite = false, content = null;
	let dirty = false, timer = null, chain = Promise.resolve(), lastWrite = '';

	const read = (path) => path.split('.').reduce((o, k) => o?.[k], content);
	const write = (path, value) => {
		const keys = path.split('.');
		const last = keys.pop();
		keys.reduce((o, k) => o[k], content)[last] = value;
	};

	function setSaved(text, bad) {
		const el = $('#saved');
		el.textContent = text;
		el.className = bad ? 'bad' : '';
	}

	function input(id, attrs, value, label, long) {
		const box = long
			? `<textarea id="${id}" ${attrs} aria-label="${esc(label)}" rows="4">${esc(value)}</textarea>`
			: `<input type="text" id="${id}" ${attrs} aria-label="${esc(label)}" value="${esc(value)}">`;
		return box;
	}

	function listHtml(list) {
		const items = read(list.path) || [];
		const safe = list.path.replace(/\./g, '-');
		const rows = items.map((item, i) => {
			const tools = list.fixed ? '' : `<div class="tools">
				<button type="button" data-move="-1" data-list="${list.path}" data-i="${i}" aria-label="Monter" ${i === 0 ? 'disabled' : ''}>↑</button>
				<button type="button" data-move="1" data-list="${list.path}" data-i="${i}" aria-label="Descendre" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>
				<button type="button" data-del data-list="${list.path}" data-i="${i}" aria-label="Retirer">×</button>
			</div>`;
			if (!list.keys) return `<div class="item">${input(`${safe}-${i}`, `data-list-item="${list.path}" data-i="${i}"`, item, list.label)}${tools}</div>`;
			const fields = list.keys.map(([key, label, long]) => `<div class="field"><label for="${safe}-${i}-${key}">${esc(label)}</label>${input(`${safe}-${i}-${key}`, `data-list-item="${list.path}" data-i="${i}" data-key="${key}"`, item[key], label, long)}</div>`).join('');
			return `<div class="item block"><div class="item-fields">${fields}</div>${tools}</div>`;
		}).join('');
		const add = list.fixed ? '' : `<button type="button" class="add" data-add="${list.path}">+ Ajouter</button>`;
		return `<p class="sub">${esc(list.label)}</p><div class="items">${rows}</div>${add}`;
	}

	function render() {
		const y = window.scrollY;
		$('#index').innerHTML = SECTIONS.map((s) => `<button type="button" data-goto="${s.id}">${esc(s.title)}</button>`).join('') + `<button type="button" data-goto="update">Mettre à jour le site</button>`;
		$('#form').innerHTML = SECTIONS.map((s) => `<section id="${s.id}" aria-labelledby="h-${s.id}">
			<h2 id="h-${s.id}">${esc(s.title)}</h2>
			${s.hint ? `<p class="hint">${esc(s.hint)}</p>` : ''}
			${s.fields.map((f) => `<div class="field"><label for="f-${f.path.replace(/\./g, '-')}">${esc(f.label)}</label>${input(`f-${f.path.replace(/\./g, '-')}`, `data-path="${f.path}"`, read(f.path), f.label, f.long)}</div>`).join('')}
			${(s.lists || []).map(listHtml).join('')}
		</section>`).join('') + `<section id="update" aria-labelledby="h-update">
			<h2 id="h-update">Mettre à jour le site</h2>
			<p class="hint">Vos modifications sont enregistrées ici automatiquement. Le site change quand vous lui donnez le nouveau fichier :</p>
			<ol>
				<li>Cliquez sur <strong>Télécharger content.json</strong>.</li>
				<li>Remplacez le fichier <code>Portfolio 2\\site\\src\\data\\content.json</code> par celui téléchargé.</li>
				<li>Le site local se met à jour tout seul.</li>
			</ol>
			<p class="hint">Vous pouvez aussi demander à Claude : « publie mes textes ».</p>
			<textarea id="copyArea" readonly hidden aria-label="Contenu du fichier content.json"></textarea>
		</section>`;
		if (!canWrite) document.querySelectorAll('#form input, #form textarea').forEach((el) => { el.readOnly = true; });
		if (!canWrite) document.querySelectorAll('#form button').forEach((el) => { el.disabled = true; });
		window.scrollTo(0, y);
		spot();
	}

	function clean() {
		const out = JSON.parse(JSON.stringify(content));
		delete out.updatedAt;
		const trim = (list, test) => list.filter(test);
		out.services = trim(out.services, (s) => s.trim());
		out.copy.about.values = trim(out.copy.about.values, (s) => s.trim());
		out.copy.contact.sessionTypes = trim(out.copy.contact.sessionTypes, (s) => s.trim());
		out.copy.contact.extraField.options = trim(out.copy.contact.extraField.options, (s) => s.trim());
		out.faq = trim(out.faq, (p) => p.q.trim() || p.a.trim());
		out.site.socials = trim(out.site.socials, (p) => p.label.trim());
		return out;
	}

	function schedule() {
		if (!canWrite) return;
		dirty = true;
		setSaved('Modification…');
		clearTimeout(timer);
		timer = setTimeout(save, 700);
	}
	function save() {
		timer = null;
		const stamp = new Date().toISOString();
		content.updatedAt = stamp;
		lastWrite = stamp;
		const data = JSON.parse(JSON.stringify(content));
		setSaved('Enregistrement…');
		chain = chain.then(() => ref.set(data)).then(() => {
			if (!timer) { dirty = false; setSaved('Enregistré'); }
		}).catch(() => {
			setSaved('Non enregistré. Nouvel essai dans 3 s.', true);
			setTimeout(() => { if (!timer) schedule(); }, 3000);
		});
	}

	$('#form').addEventListener('submit', (e) => e.preventDefault());
	$('#form').addEventListener('input', (e) => {
		const t = e.target;
		if (t.dataset.path) {
			write(t.dataset.path, t.value);
			if (t.dataset.path === 'site.email') t.classList.toggle('bad-in', !/^\S+@\S+\.\S+$/.test(t.value));
			if (t.dataset.path === 'site.name') t.classList.toggle('bad-in', !t.value.trim());
		} else if (t.dataset.listItem) {
			const list = read(t.dataset.listItem);
			const i = Number(t.dataset.i);
			if (t.dataset.key) list[i][t.dataset.key] = t.value; else list[i] = t.value;
		} else return;
		schedule();
	});
	$('#form').addEventListener('click', (e) => {
		const b = e.target.closest('button');
		if (!b || !canWrite) return;
		if (b.dataset.add) {
			const def = SECTIONS.flatMap((s) => s.lists || []).find((l) => l.path === b.dataset.add);
			read(b.dataset.add).push(typeof def.blank === 'string' ? '' : { ...def.blank });
		} else if (b.dataset.list) {
			const list = read(b.dataset.list);
			const i = Number(b.dataset.i);
			if (b.dataset.del !== undefined) list.splice(i, 1);
			else {
				const j = i + Number(b.dataset.move);
				[list[i], list[j]] = [list[j], list[i]];
			}
		} else return;
		render();
		schedule();
	});

	$('#index').addEventListener('click', (e) => {
		const id = e.target.dataset.goto;
		if (id) document.getElementById(id).scrollIntoView({ block: 'start' });
	});
	function spot() {
		const all = [...document.querySelectorAll('#form section')];
		const now = all.filter((s) => s.getBoundingClientRect().top < 200).pop() || all[0];
		document.querySelectorAll('#index button').forEach((b) => b.classList.toggle('on', b.dataset.goto === now?.id));
	}
	window.addEventListener('scroll', spot, { passive: true });

	const fileText = () => JSON.stringify(clean(), null, '\t') + '\n';
	$('#saveBtn').addEventListener('click', async () => {
		if (!/^\S+@\S+\.\S+$/.test(content.site.email) || !content.site.name.trim()) {
			setSaved('Vérifiez le nom et l’e-mail avant de télécharger.', true);
			document.getElementById('coordonnees').scrollIntoView();
			return;
		}
		try {
			await downloads.save({ filename: 'content.json', data: fileText() });
			setSaved('Fichier téléchargé');
		} catch (err) {
			setSaved(err?.code === 'declined' ? 'Téléchargement annulé' : 'Téléchargement indisponible ici. Utilisez Copier le fichier.', err?.code !== 'declined');
		}
	});
	$('#copyBtn').addEventListener('click', async () => {
		const text = fileText();
		try {
			await navigator.clipboard.writeText(text);
			setSaved('Fichier copié');
		} catch (_) {
			const area = $('#copyArea');
			area.value = text;
			area.hidden = false;
			area.scrollIntoView({ block: 'center' });
			area.select();
			setSaved('Sélectionnez le texte affiché pour le copier.');
		}
	});

	(async () => {
		const failed = setTimeout(() => {
			if (!content) $('#form').innerHTML = '<p class="state">Vos textes n’ont pas pu se charger. Ouvrez cette page depuis claude.ai, connecté à votre compte.</p>';
		}, 10000);
		db = await window.claude?.use?.('db');
		if (!db) { clearTimeout(failed); setSaved('Hors ligne', true); $('#form').innerHTML = '<p class="state">Ouvrez cette page depuis claude.ai, connecté à votre compte : c’est là que vos textes sont enregistrés.</p>'; return; }
		const [user, dl] = await Promise.all([window.claude.use('user'), window.claude.use('downloads')]);
		downloads = dl;
		try { canWrite = user ? await user.canEdit() : true; } catch (_) { canWrite = true; }
		ref = db.doc('content/site');
		ref.onSnapshot((snap) => {
			clearTimeout(failed);
			if (!snap.exists) { $('#form').innerHTML = '<p class="state">Aucun texte enregistré pour l’instant.</p>'; setSaved(''); return; }
			const data = snap.data();
			if (dirty || (content && data.updatedAt === lastWrite)) return;
			content = data;
			render();
			setSaved(canWrite ? 'Enregistré' : 'Lecture seule');
			$('#saveBtn').disabled = !downloads;
			$('#copyBtn').disabled = false;
		}, () => {
			clearTimeout(failed);
			setSaved('Connexion perdue. Rechargez la page.', true);
		});
	})();
})();
</script>
